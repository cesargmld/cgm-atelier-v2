<!DOCTYPE html>
<html lang="es" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <meta name="description" content="CGM Atelier — Práctica de arquitectura y territorio. Monterrey, México." />

  <!-- Tipografía Diatype / Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f2f2f2;
      --text: #000000;
      --muted: #888888;
      --blue: #0000ff;
      --font: "Diatype Variable", "ABC Diatype", "Diatype", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --pad-x: 24px;
      --pad-top: 22px;
    }

    html.dark {
      --bg: #0c0c0c;
      --text: #f5f5f5;
      --muted: #808080;
      --blue: #3b82f6;
    }

    @media (min-width: 768px) {
      :root {
        --pad-x: 40px;
        --pad-top: 28px;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border: 0;
      outline: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.5;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    a, button {
      color: inherit;
      text-decoration: none;
      background: none;
      cursor: pointer;
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      transition: color 0.1s ease;
    }

    a:hover, button:hover {
      color: var(--blue) !important;
    }

    .active, a.active, button.active {
      color: var(--blue) !important;
    }

    /* CABECERA FIJA FLOTANTE TRANSPARENTE */
    nav#header-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 500;
      padding: var(--pad-top) var(--pad-x);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      background: transparent;
      pointer-events: none;
      transition: color 0.15s ease;
    }

    nav#header-nav * {
      pointer-events: auto;
    }

    /* Adaptación del menú cuando está sobre una imagen */
    nav#header-nav.is-over-image,
    nav#header-nav.is-over-image a,
    nav#header-nav.is-over-image button {
      color: #ffffff !important;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.45);
    }

    nav#header-nav.is-over-image a:hover,
    nav#header-nav.is-over-image button:hover {
      color: var(--blue) !important;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    @media (min-width: 768px) {
      .brand-title {
        font-size: 24px;
      }
    }

    .nav-links {
      display: flex;
      align-items: baseline;
      gap: 18px;
      font-size: 16px;
    }

    @media (min-width: 768px) {
      .nav-links {
        gap: 26px;
      }
    }

    .theme-toggle-btn {
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      text-transform: lowercase;
    }

    /* CONTENEDOR PRINCIPAL CON AMPLIA SEPARACIÓN */
    main#content {
      padding-top: 130px;
      padding-left: var(--pad-x);
      padding-right: var(--pad-x);
      padding-bottom: 120px;
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
    }

    @media (min-width: 768px) {
      main#content {
        padding-top: 150px;
      }
    }

    /* =========================================================
       1. PORTADA DISPERSA EN ZONAS RANDOM, SEPARADAS Y DIFERENTES TAMAÑOS
       ========================================================= */
    #view-home {
      cursor: pointer;
      position: relative;
      width: 100%;
      min-height: 220vh;
      margin-top: -30px;
    }

    .scatter-canvas {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 220vh;
    }

    .scatter-item {
      position: absolute;
      background-color: rgba(128, 128, 128, 0.15);
      overflow: hidden;
      display: block;
      transition: opacity 0.15s ease;
      cursor: pointer;
    }

    .scatter-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .scatter-item:hover {
      opacity: 0.88;
    }

    /* =========================================================
       2. LISTADO DE PROYECTOS (WORK) - TIPOGRAFÍA GRANDE, PURA Y CONSISTENTE
       ========================================================= */
    #view-work {
      max-width: 1100px;
    }

    .project-item {
      display: block;
      margin-bottom: 10px;
      cursor: pointer;
    }

    @media (min-width: 768px) {
      .project-item {
        margin-bottom: 12px;
      }
    }

    .project-item a {
      display: inline-block;
      font-size: 26px;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--text);
      transition: color 0.08s ease;
    }

    @media (min-width: 768px) {
      .project-item a {
        font-size: 34px;
        line-height: 1.22;
      }
    }

    @media (min-width: 1200px) {
      .project-item a {
        font-size: 38px;
      }
    }

    .project-item a:hover {
      color: var(--blue) !important;
    }

    /* IMAGEN FLOTANTE EN HOVER: EN SECO, RANDOM POS & RANDOM SIZE */
    #hover-floating-image {
      position: fixed;
      pointer-events: none;
      z-index: 450;
      display: none;
      transition: none !important;
      animation: none !important;
    }

    #hover-floating-image img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
      background-color: rgba(128, 128, 128, 0.2);
      transition: none !important;
      animation: none !important;
    }

    /* =========================================================
       3. EXPEDIENTE DE PROYECTO (PROJECT DETAIL)
       ========================================================= */
    #view-project {
      max-width: 1080px;
    }

    /* Sección de texto que se desvanece suavemente al scrollear hacia las fotos */
    #detail-text-section {
      transition: opacity 0.25s ease;
      will-change: opacity;
    }

    .detail-hero-title {
      font-size: 32px;
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.025em;
      margin-bottom: 8px;
      color: var(--text);
    }

    @media (min-width: 768px) {
      .detail-hero-title {
        font-size: 46px;
      }
    }

    .detail-location-sub {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .meta-layout {
      display: flex;
      flex-wrap: wrap;
      gap: 20px 48px;
      margin-bottom: 40px;
      font-size: 15px;
      line-height: 1.4;
    }

    .meta-entry {
      display: flex;
      flex-direction: column;
    }

    .meta-entry-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 2px;
    }

    .meta-entry-value {
      color: var(--text);
      font-weight: 400;
    }

    .detail-description {
      font-size: 16px;
      line-height: 1.6;
      max-width: 820px;
      margin-bottom: 56px;
      color: var(--text);
    }

    .detail-description p {
      margin-bottom: 16px;
    }

    .image-stream {
      display: flex;
      flex-direction: column;
      gap: 40px;
      margin-top: 40px;
    }

    @media (min-width: 768px) {
      .image-stream {
        gap: 64px;
      }
    }

    .image-stream-item {
      width: 100%;
    }

    .image-stream-item img {
      width: 100%;
      height: auto;
      display: block;
      background-color: rgba(128, 128, 128, 0.15);
    }

    /* =========================================================
       4. TALLER / INFO (+)
       ========================================================= */
    #view-info {
      max-width: 820px;
    }

    .info-bio {
      font-size: 18px;
      line-height: 1.55;
      margin-bottom: 44px;
      color: var(--text);
    }

    @media (min-width: 768px) {
      .info-bio {
        font-size: 20px;
        line-height: 1.5;
        margin-bottom: 56px;
      }
    }

    .info-bio p {
      margin-bottom: 20px;
    }

    .info-section-title {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .info-list {
      list-style: none;
      margin-bottom: 44px;
      font-size: 15px;
      line-height: 1.6;
    }

    .info-contacts {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 15px;
    }

    .info-contacts a {
      color: var(--text);
    }

    .info-contacts a:hover {
      color: var(--blue);
    }

    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>

    let currentLang = 'es';
    let currentTheme = 'light';
    let currentView = 'home';
    let currentProjectId = null;
    let projects = DEFAULT_PROJECTS;

    function getText(obj, lang) {
      if (!obj) return '';
      if (typeof obj === 'string') return obj;
      return obj[lang] || obj['es'] || obj['en'] || '';
    }

    function getTypology(p, lang) {
      const cats = Array.isArray(p.categories) ? p.categories : (p.category ? [p.category] : []);
      if (!cats.length) return '';
      return cats.map(cId => {
        const found = ALL_TYPOLOGIES.find(t => t.id === cId);
        return found ? found[lang] : cId;
      }).join(', ');
    }

    /* =========================================================
       1. PORTADA DISPERSA EN ZONAS RANDOM, SEPARADAS Y VARIABLES
       ========================================================= */
    function renderHomeScatter() {
      const container = document.getElementById('scatter-canvas-el');
      if (!container) return;

      const keys = Object.keys(projects);
      const isMobile = window.innerWidth < 768;
      const count = isMobile ? 8 : 14;

      const totalHeight = isMobile ? 2000 : 2800;
      container.style.height = totalHeight + 'px';

      const stepY = totalHeight / count;
      let html = '';

      for (let i = 0; i < count; i++) {
        const k = keys[i % keys.length];
        const p = projects[k];
        if (!p) continue;
        const img = p.homeImage || (p.images && p.images[0] ? p.images[0] : '');
        if (!img) continue;

        const width = isMobile
          ? Math.floor(160 + Math.random() * 140)
          : Math.floor(220 + Math.random() * 260);

        const maxLeft = isMobile ? (window.innerWidth - width - 30) : (container.clientWidth - width - 60);
        const left = Math.max(10, Math.floor(10 + Math.random() * Math.max(20, maxLeft)));
        const top = Math.floor(i * stepY + (Math.random() * (stepY * 0.45)));

        const aspectRatios = ['3/4', '4/3', '16/10', '1/1', '14/9'];
        const aspect = aspectRatios[Math.floor(Math.random() * aspectRatios.length)];

        html += `
          <div class="scatter-item" style="top: ${top}px; left: ${left}px; width: ${width}px; aspect-ratio: ${aspect};">
            <img src="${img}" alt="${getText(p.title, currentLang)}" loading="lazy" />
          </div>
        `;
      }

      container.innerHTML = html;
    }

    /* =========================================================
       2. LISTADO DE PROYECTOS (WORK) - TIPOGRAFÍA GRANDE
       ========================================================= */
    function renderWorkList() {
      const container = document.getElementById('projects-list-container');
      if (!container) return;

      const keys = Object.keys(projects).sort((a, b) => {
        return parseInt(projects[b].year || '0', 10) - parseInt(projects[a].year || '0', 10);
      });

      container.innerHTML = keys.map(k => {
        const p = projects[k];
        const title = getText(p.title, currentLang);

        return `
          <div class="project-item" onmouseenter="showHoverImage('${k}', event)" onmouseleave="hideHoverImage()">
            <a href="#${k}" onclick="openProject('${k}', event)">${title}</a>
          </div>
        `;
      }).join('');
    }

    /* =========================================================
       3. IMAGEN FLOTANTE EN HOVER (EN SECO, RANDOM POS & RANDOM SIZE)
       ========================================================= */
    function showHoverImage(key, e) {
      const p = projects[key];
      if (!p) return;
      const imgUrl = (p.images && p.images[0]) || p.homeImage || '';
      if (!imgUrl) return;

      const hoverBox = document.getElementById('hover-floating-image');
      const hoverImg = document.getElementById('hover-img-el');
      if (!hoverBox || !hoverImg) return;

      const randomWidth = Math.floor(280 + Math.random() * 240);
      const pad = 40;
      const maxLeft = Math.max(pad, window.innerWidth - randomWidth - pad);
      const maxTop = Math.max(pad, window.innerHeight - (randomWidth * 0.75) - pad);

      const randomLeft = Math.floor(pad + Math.random() * (maxLeft - pad));
      const randomTop = Math.floor(pad + Math.random() * (maxTop - pad));

      hoverImg.src = imgUrl;
      hoverBox.style.width = randomWidth + 'px';
      hoverBox.style.left = randomLeft + 'px';
      hoverBox.style.top = randomTop + 'px';
      hoverBox.style.display = 'block';
    }

    function hideHoverImage() {
      const hoverBox = document.getElementById('hover-floating-image');
      if (hoverBox) {
        hoverBox.style.display = 'none';
      }
    }

    /* =========================================================
       4. EXPEDIENTE DE PROYECTO (PROJECT DETAIL)
       ========================================================= */
    function openProject(key, e) {
      if (e) e.preventDefault();
      hideHoverImage();
      const p = projects[key];
      if (!p) return;

      currentProjectId = key;
      currentView = 'project';
      window.location.hash = key;

      document.getElementById('view-home').style.display = 'none';
      document.getElementById('view-work').style.display = 'none';
      document.getElementById('view-info').style.display = 'none';
      
      const projView = document.getElementById('view-project');
      projView.style.display = 'block';

      // Restaurar opacidad del texto
      const textSec = document.getElementById('detail-text-section');
      if (textSec) {
        textSec.style.opacity = '1';
        textSec.style.pointerEvents = 'auto';
      }

      document.getElementById('nav-brand').classList.remove('active');
      document.getElementById('nav-work').classList.add('active');
      document.getElementById('nav-info').classList.remove('active');

      const fullTitle = getText(p.title, currentLang);
      document.getElementById('detail-title').innerText = fullTitle;
      document.getElementById('detail-location').innerText = p.location || '';

      const metaContainer = document.getElementById('detail-meta');
      const metaItems = [
        { label: currentLang === 'es' ? 'año' : 'year', value: p.year },
        { label: currentLang === 'es' ? 'ubicación' : 'location', value: p.location },
        { label: currentLang === 'es' ? 'tipología' : 'typology', value: getTypology(p, currentLang) },
        { label: currentLang === 'es' ? 'área' : 'area', value: p.m2 ? (String(p.m2).includes('m') || String(p.m2).includes('sq') ? p.m2 : p.m2 + ' m²') : '' },
        { label: currentLang === 'es' ? 'equipo' : 'team', value: p.team },
        { label: currentLang === 'es' ? 'programa' : 'program', value: p.program },
        { label: currentLang === 'es' ? 'tutor' : 'tutor', value: p.tutor },
        { label: currentLang === 'es' ? 'reconocimiento' : 'distinction', value: p.distinction },
        { label: currentLang === 'es' ? 'cliente' : 'client', value: p.client },
        { label: currentLang === 'es' ? 'fotografía' : 'photography', value: p.photography }
      ];

      metaContainer.innerHTML = metaItems
        .filter(m => m.value && String(m.value).trim() !== '')
        .map(m => `
          <div class="meta-entry">
            <span class="meta-entry-label">${m.label}</span>
            <span class="meta-entry-value">${m.value}</span>
          </div>
        `).join('');

      const narrativeContainer = document.getElementById('detail-narrative');
      const summaryText = getText(p.summary, currentLang);
      const fullText = getText(p.full, currentLang);
      narrativeContainer.innerHTML = `
        ${summaryText ? `<p style="font-size: 17px; margin-bottom: 20px;">${summaryText}</p>` : ''}
        ${fullText || ''}
      `;

      const galleryContainer = document.getElementById('detail-gallery');
      const imgs = p.images || [];
      galleryContainer.innerHTML = imgs.map((url, i) => `
        <div class="image-stream-item">
          <img src="${url}" alt="${fullTitle} [${i + 1}]" loading="lazy" />
        </div>
      `).join('');

      window.scrollTo({ top: 0, behavior: 'instant' });
      handleScrollUpdates();
    }

    /* =========================================================
       5. TALLER / INFO (+)
       ========================================================= */
    function renderInfoView() {
      const m1 = getText(DEFAULT_TALLER.manifesto_1, currentLang);
      const m2 = getText(DEFAULT_TALLER.manifesto_2, currentLang);
      document.getElementById('info-bio-text').innerHTML = `${m1}<div style="height: 20px;"></div>${m2}`;
      
      const distList = document.getElementById('info-distinctions-list');
      if (distList && DEFAULT_TALLER.distinctions) {
        distList.innerHTML = DEFAULT_TALLER.distinctions.map(d => {
          const t = typeof d === 'string' ? d : getText(d, currentLang);
          return `<li style="margin-bottom: 8px;">${t}</li>`;
        }).join('');
      }

      const lblDist = document.getElementById('lbl-distinctions');
      const lblCont = document.getElementById('lbl-contact');
      if (lblDist) lblDist.innerText = currentLang === 'es' ? 'reconocimientos & concursos' : 'honors & competitions';
      if (lblCont) lblCont.innerText = currentLang === 'es' ? 'contacto' : 'contact';
    }

    /* =========================================================
       6. ENRUTADOR, SCROLL Y CONTRASTE ADAPTATIVO
       ========================================================= */
    function navigateTo(target, e) {
      if (e) e.preventDefault();
      hideHoverImage();
      currentView = target;
      window.location.hash = target;

      const vHome = document.getElementById('view-home');
      const vWork = document.getElementById('view-work');
      const vInfo = document.getElementById('view-info');
      const vProj = document.getElementById('view-project');
      const nBrand = document.getElementById('nav-brand');
      const nWork = document.getElementById('nav-work');
      const nInfo = document.getElementById('nav-info');

      vHome.style.display = 'none';
      vWork.style.display = 'none';
      vInfo.style.display = 'none';
      vProj.style.display = 'none';

      nBrand.classList.remove('active');
      nWork.classList.remove('active');
      nInfo.classList.remove('active');

      if (target === 'home') {
        vHome.style.display = 'block';
        nBrand.classList.add('active');
        renderHomeScatter();
      } else if (target === 'work') {
        vWork.style.display = 'block';
        nWork.classList.add('active');
      } else if (target === 'info') {
        vInfo.style.display = 'block';
        nInfo.classList.add('active');
      }

      window.scrollTo({ top: 0, behavior: 'instant' });
      handleScrollUpdates();
    }

    function toggleLang() {
      currentLang = (currentLang === 'es') ? 'en' : 'es';
      document.getElementById('nav-lang').innerText = currentLang;
      document.getElementById('nav-info').innerText = currentLang === 'es' ? '+ taller' : '+ office';
      renderWorkList();
      renderInfoView();
      if (currentView === 'home') {
        renderHomeScatter();
      } else if (currentView === 'project' && currentProjectId) {
        openProject(currentProjectId);
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      const themeBtn = document.getElementById('nav-theme');
      if (currentTheme === 'light') {
        currentTheme = 'dark';
        html.classList.remove('light');
        html.classList.add('dark');
        themeBtn.innerText = 'light';
      } else {
        currentTheme = 'light';
        html.classList.remove('dark');
        html.classList.add('light');
        themeBtn.innerText = 'dark';
      }
      handleScrollUpdates();
    }

    /* DETECCIÓN DE SCROLL: FADE OUT DE TEXTO Y CONTRASTE SOBRE IMÁGENES */
    function handleScrollUpdates() {
      const nav = document.getElementById('header-nav');
      if (!nav) return;

      const navRect = nav.getBoundingClientRect();
      const navY = navRect.top + navRect.height / 2;

      // 1. Desvanecer el texto del proyecto conforme el usuario scrollea hacia las fotos
      const textSec = document.getElementById('detail-text-section');
      if (textSec && currentView === 'project') {
        const rect = textSec.getBoundingClientRect();
        if (rect.bottom < 140) {
          textSec.style.opacity = '0';
          textSec.style.pointerEvents = 'none';
        } else if (rect.top < 60) {
          const factor = Math.max(0, Math.min(1, (rect.bottom - 100) / 180));
          textSec.style.opacity = factor.toFixed(2);
          textSec.style.pointerEvents = factor < 0.1 ? 'none' : 'auto';
        } else {
          textSec.style.opacity = '1';
          textSec.style.pointerEvents = 'auto';
        }
      }

      // 2. Detección de contraste: si el menú fijo pasa sobre alguna imagen visible
      const images = document.querySelectorAll('img');
      let isOverImage = false;
      for (let i = 0; i < images.length; i++) {
        const img = images[i];
        if (img.id === 'hover-img-el') continue;
        if (!img.offsetParent) continue;
        const r = img.getBoundingClientRect();
        if (r.bottom > navRect.top + 4 && r.top < navRect.bottom - 4) {
          isOverImage = true;
          break;
        }
      }

      if (isOverImage) {
        nav.classList.add('is-over-image');
      } else {
        nav.classList.remove('is-over-image');
      }
    }

    window.addEventListener('scroll', handleScrollUpdates, { passive: true });

    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.replace('#', '');
      if (!hash || hash === 'home') {
        navigateTo('home');
      } else if (hash === 'work') {
        navigateTo('work');
      } else if (hash === 'info') {
        navigateTo('info');
      } else if (projects[hash]) {
        openProject(hash);
      }
    });

    window.addEventListener('resize', () => {
      if (currentView === 'home') {
        renderHomeScatter();
      }
      handleScrollUpdates();
    });

    // Sincronización Sanity CMS
    async function fetchSanity() {
      if (!SANITY_CONFIG.projectId) return;
      const q = encodeURIComponent(`{
        "projects": *[_type == "project"] | order(orderNumber asc, _createdAt desc) {
          _id, "slug": slug.current,
          "title": { "es": coalesce(title_es, title.es, title, "Sin título"), "en": coalesce(title_en, title.en, title, "Untitled") },
          categories, location, team, year, m2, program, tutor, distinction, client, photography,
          "summary": { "es": coalesce(summary_es, summary.es, ""), "en": coalesce(summary_en, summary.en, "") },
          "full": { "es": coalesce(full_es, full.es, ""), "en": coalesce(full_en, full.en, "") },
          "images": images[].asset->url,
          "homeImage": homeImage.asset->url
        }
      }`);
      try {
        const res = await fetch(`https://${SANITY_CONFIG.projectId}.api.sanity.io/v${SANITY_CONFIG.apiVersion}/data/query/${SANITY_CONFIG.dataset}?query=${q}`);
        const data = await res.json();
        if (data && data.result && data.result.projects && data.result.projects.length) {
          const map = {};
          data.result.projects.forEach(p => {
            const k = p.slug || p._id;
            map[k] = p;
          });
          projects = map;
          if (currentView === 'home') renderHomeScatter();
          renderWorkList();
          if (currentView === 'project' && currentProjectId && projects[currentProjectId]) {
            openProject(currentProjectId);
          }
        }
      } catch (e) {
        console.log('Sanity fallback activo.');
      }
    }

    // Inicialización
    (function init() {
      renderHomeScatter();
      renderWorkList();
      renderInfoView();
      fetchSanity();

      const hash = window.location.hash.replace('#', '');
      if (hash && hash !== 'home' && hash !== 'work' && hash !== 'info' && projects[hash]) {
        openProject(hash);
      } else if (hash === 'work') {
        navigateTo('work');
      } else if (hash === 'info') {
        navigateTo('info');
      } else {
        navigateTo('home');
      }
      setTimeout(handleScrollUpdates, 50);
    })();
  </script>
</body>
</html>
