<!DOCTYPE html>
<html lang="es" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CGM ATELIER — César González Maldonado</title>
  <meta name="description" content="CGM Atelier — Práctica de arquitectura y territorio. Monterrey, México." />

  <!-- Tipografía Geist (Google Fonts) con fallback a ABC Diatype y Suisse Intl -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    /* Configuración para archivos locales de ABC Diatype en ./fonts/ */
    @font-face {
      font-family: 'ABC Diatype';
      src: local('ABC Diatype Regular'), local('ABCDiatype-Regular'), local('Diatype Regular'),
           url('./fonts/ABCDiatype-Regular.woff2') format('woff2'),
           url('./fonts/ABCDiatype-Regular.woff') format('woff'),
           url('./fonts/ABCDiatype-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'ABC Diatype';
      src: local('ABC Diatype Medium'), local('ABCDiatype-Medium'), local('Diatype Medium'),
           url('./fonts/ABCDiatype-Medium.woff2') format('woff2'),
           url('./fonts/ABCDiatype-Medium.woff') format('woff'),
           url('./fonts/ABCDiatype-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #f2f2f2;
      --text: #000000;
      --muted: #767676;
      --accent: #d97a47;
      --blue: #d97a47;
      --font: "ABC Diatype", "Geist", "Suisse Intl", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --pad-x: 24px;
      --pad-top: 22px;
    }

    html.dark {
      --bg: #0c0c0c;
      --text: #f4f4f4;
      --muted: #888888;
      --accent: #d97a47;
      --blue: #d97a47;
    }

    @media (min-width: 768px) {
      :root {
        --pad-x: 44px;
        --pad-top: 28px;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border: 0;
      outline: 0;
    }

    ::selection {
      background-color: #d97a47;
      color: #ffffff;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.5;
      letter-spacing: -0.015em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    a, button {
      color: inherit;
      text-decoration: none;
      background: none;
      cursor: pointer;
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      transition: color 0.1s ease, opacity 0.1s ease;
    }

    a:hover, button:hover {
      color: #d97a47 !important;
    }

    .active, a.active, button.active {
      color: #d97a47 !important;
    }

    /* CABECERA FIJA FLOTANTE TRANSPARENTE */
    nav#header-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 500;
      padding: var(--pad-top) var(--pad-x);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      background: transparent;
      pointer-events: none;
      transition: color 0.15s ease;
    }

    nav#header-nav * {
      pointer-events: auto;
    }

    /* Detección de contraste sobre imágenes */
    nav#header-nav.is-over-image,
    nav#header-nav.is-over-image a,
    nav#header-nav.is-over-image button {
      color: #ffffff !important;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
    }

    nav#header-nav.is-over-image a:hover,
    nav#header-nav.is-over-image button:hover {
      color: #d97a47 !important;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    .brand-title:hover {
      color: #d97a47 !important;
    }

    @media (min-width: 768px) {
      .brand-title {
        font-size: 22px;
      }
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 15px;
    }

    @media (min-width: 768px) {
      .nav-links {
        gap: 26px;
      }
    }

    /* Selector de idioma ES/EN */
    .lang-switcher {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    .lang-btn {
      color: var(--muted);
      font-weight: 400;
    }

    .lang-btn.active {
      color: var(--text) !important;
      font-weight: 500;
    }

    .lang-btn:hover {
      color: #d97a47 !important;
    }

    /* Icono de Dark/Light Mode */
    .theme-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      color: var(--muted);
    }

    .theme-icon-btn:hover {
      color: #d97a47 !important;
    }

    /* CONTENEDOR PRINCIPAL */
    main#content {
      padding-top: 130px;
      padding-left: var(--pad-x);
      padding-right: var(--pad-x);
      padding-bottom: 120px;
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @media (min-width: 768px) {
      main#content {
        padding-top: 150px;
      }
    }

    /* =========================================================
       1. LISTADO DE PROYECTOS (CENTRADO HORIZONTALMENTE)
       ========================================================= */
    #view-projects {
      max-width: 980px;
      width: 100%;
      margin: 0 auto;
    }

    .project-item {
      display: block;
      width: 100%;
      margin-bottom: 16px;
      cursor: pointer;
    }

    @media (min-width: 768px) {
      .project-item {
        margin-bottom: 20px;
      }
    }

    .project-item a {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      color: var(--text);
      transition: color 0.08s ease;
    }

    @media (min-width: 640px) {
      .project-item a {
        flex-direction: row;
        justify-content: space-between;
        align-items: baseline;
        gap: 32px;
      }
    }

    .project-title {
      font-size: 24px;
      font-weight: 400;
      letter-spacing: -0.025em;
      line-height: 1.22;
      transition: color 0.08s ease;
    }

    @media (min-width: 768px) {
      .project-title {
        font-size: 30px;
        line-height: 1.2;
      }
    }

    @media (min-width: 1200px) {
      .project-title {
        font-size: 34px;
      }
    }

    .project-meta {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0;
      white-space: nowrap;
      transition: color 0.08s ease;
      flex-shrink: 0;
    }

    @media (min-width: 768px) {
      .project-meta {
        font-size: 14px;
      }
    }

    .project-item:hover .project-title,
    .project-item:hover .project-meta {
      color: #d97a47 !important;
    }

    /* IMAGEN FLOTANTE EN HOVER */
    #hover-floating-image {
      position: fixed;
      pointer-events: none;
      z-index: 450;
      display: none;
      transition: none !important;
      animation: none !important;
    }

    #hover-floating-image img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
      background-color: rgba(128, 128, 128, 0.2);
      transition: none !important;
      animation: none !important;
    }

    /* =========================================================
       2. EXPEDIENTE DE PROYECTO (PROJECT DETAIL)
       ========================================================= */
    #view-project {
      max-width: 1040px;
      width: 100%;
      margin: 0 auto;
    }

    #detail-text-section {
      transition: opacity 0.25s ease;
      will-change: opacity;
    }

    .detail-hero-title {
      font-size: 32px;
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.025em;
      margin-bottom: 8px;
      color: var(--text);
    }

    @media (min-width: 768px) {
      .detail-hero-title {
        font-size: 44px;
      }
    }

    .detail-location-sub {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .meta-layout {
      display: flex;
      flex-wrap: wrap;
      gap: 20px 48px;
      margin-bottom: 40px;
      font-size: 15px;
      line-height: 1.4;
    }

    .meta-entry {
      display: flex;
      flex-direction: column;
    }

    .meta-entry-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 2px;
    }

    .meta-entry-value {
      color: var(--text);
      font-weight: 400;
    }

    .detail-description {
      font-size: 16px;
      line-height: 1.6;
      max-width: 820px;
      margin-bottom: 56px;
      color: var(--text);
    }

    .detail-description p {
      margin-bottom: 16px;
    }

    .image-stream {
      display: flex;
      flex-direction: column;
      gap: 40px;
      margin-top: 40px;
    }

    @media (min-width: 768px) {
      .image-stream {
        gap: 64px;
      }
    }

    .image-stream-item {
      width: 100%;
    }

    .image-stream-item img {
      width: 100%;
      height: auto;
      display: block;
      background-color: rgba(128, 128, 128, 0.15);
    }

    /* =========================================================
       3. TALLER
       ========================================================= */
    #view-taller {
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    .info-bio {
      font-size: 18px;
      line-height: 1.55;
      margin-bottom: 44px;
      color: var(--text);
    }

    @media (min-width: 768px) {
      .info-bio {
        font-size: 20px;
        line-height: 1.5;
        margin-bottom: 56px;
      }
    }

    .info-bio p {
      margin-bottom: 20px;
    }

    .info-section-title {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
      letter-spacing: 0.02em;
    }

    .info-list {
      list-style: none;
      margin-bottom: 44px;
      font-size: 15px;
      line-height: 1.65;
    }

    /* =========================================================
       4. CONTACTO
       ========================================================= */
    #view-contact {
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    .contact-intro {
      font-size: 18px;
      line-height: 1.55;
      margin-bottom: 36px;
      color: var(--text);
    }

    .contact-channels {
      display: flex;
      flex-direction: column;
      gap: 16px;
      font-size: 16px;
    }

    .contact-channel-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .contact-channel-label {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .contact-channel-item a {
      color: var(--text);
      font-size: 16px;
    }

    .contact-channel-item a:hover {
      color: #d97a47 !important;
    }

    /* =========================================================
       5. PORTADA DISPERSA (OPCIONAL EN #HOME)
       ========================================================= */
    #view-home {
      cursor: pointer;
      position: relative;
      width: 100%;
      min-height: 220vh;
      margin-top: -30px;
    }

    .scatter-canvas {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 220vh;
    }

    .scatter-item {
      position: absolute;
      background-color: rgba(128, 128, 128, 0.15);
      overflow: hidden;
      display: block;
      transition: opacity 0.15s ease;
      cursor: pointer;
    }

    .scatter-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .scatter-item:hover {
      opacity: 0.88;
    }

    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>

  <!-- CABECERA FIJA SUPERIOR -->
  <nav id="header-nav">
    <div>

      <a href="#projects" onclick="navigateTo('projects', event)" id="nav-projects" class="active">Proyectos</a>
      <a href="#taller" onclick="navigateTo('taller', event)" id="nav-taller">Taller</a>
      <a href="#contact" onclick="navigateTo('contact', event)" id="nav-contact">Contacto</a>

      <!-- Selector de Idioma ES / EN -->
      <div class="lang-switcher">
        <button onclick="setLang('es')" id="btn-lang-es" class="lang-btn active">ES</button>
        <span style="color: var(--muted);">/</span>
        <button onclick="setLang('en')" id="btn-lang-en" class="lang-btn">EN</button>
      </div>

      <!-- Icono Minimalista Light/Dark Mode -->
      <button onclick="toggleTheme()" id="btn-theme-toggle" class="theme-icon-btn" title="Cambiar tema">
        <svg id="icon-theme-circle" class="w-3.5 h-3.5 stroke-current fill-none" style="width: 14px; height: 14px;" viewBox="0 0 24 24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

          <path id="theme-half-disk" fill="#d97a47" class="hidden" d="M12 3a9 9 0 0 0 0 18V3z"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- CONTENIDO PRINCIPAL -->
  <main id="content">
    
    <!-- VISTA PRINCIPAL: LISTADO DE PROYECTOS (CENTRADO HORIZONTALMENTE) -->
    <section id="view-projects">
      <div id="projects-list-container"></div>
    </section>

    <!-- VISTA EXPEDIENTE DE PROYECTO (PROJECT DETAIL) -->
    <article id="view-project" style="display: none;">
      <div id="detail-text-section">
        <h1 id="detail-title" class="detail-hero-title"></h1>
        <div id="detail-location" class="detail-location-sub"></div>
        <div id="detail-meta" class="meta-layout"></div>
        <div id="detail-narrative" class="detail-description"></div>
      </div>
      <div id="detail-gallery" class="image-stream"></div>
    </article>

    <!-- VISTA TALLER -->
    <section id="view-taller" style="display: none;">
      <div id="taller-bio-text" class="info-bio"></div>
      <div>
        <div class="info-section-title" id="lbl-distinctions">Concursos & Distinciones</div>
        <ul id="taller-distinctions-list" class="info-list"></ul>
      </div>
    </section>

    <!-- VISTA CONTACTO -->
    <section id="view-contact" style="display: none;">
      <p id="contact-intro-text" class="contact-intro"></p>
      
      <div class="contact-channels">
        <div class="contact-channel-item">
          <span class="contact-channel-label" id="lbl-proj-contact">Proyectos</span>
          <a id="link-contact-projects" href="mailto:info@cgmatelier.com">info@cgmatelier.com</a>
        </div>
        <div class="contact-channel-item">
          <span class="contact-channel-label" id="lbl-press-contact">Prensa & Publicaciones</span>
          <a id="link-contact-press" href="mailto:press@cgmatelier.com">press@cgmatelier.com</a>

        <div class="contact-channel-item">
          <span class="contact-channel-label" id="lbl-careers-contact">Vacantes</span>
          <a id="link-contact-careers" href="mailto:vacantes@cgmatelier.com">vacantes@cgmatelier.com</a>
        </div>
        <div style="color: var(--muted); margin-top: 14px; font-size: 14px;">Monterrey, México</div>
      </div>
    </section>

    <!-- VISTA PORTADA DISPERSA (ACCESIBLE EN #HOME) -->
    <section id="view-home" style="display: none;" onclick="navigateTo('projects', event)">
      <div class="scatter-canvas" id="scatter-canvas-el"></div>
    </section>

  </main>

  <div id="hover-floating-image">
    <img id="hover-img-el" src="" alt="preview" />
  </div>

    let currentLang = 'es';
    let currentTheme = 'light';

    let currentProjectId = null;
    let projects = DEFAULT_PROJECTS;
    let tallerData = DEFAULT_TALLER;

    function getText(obj, lang) {
      if (!obj) return '';
      if (typeof obj === 'string') return obj;
      return obj[lang] || obj['es'] || obj['en'] || '';
    }

    function getCoordinatesOnly(p) {
      if (!p || !p.location) return '';
      if (p.location.includes('·')) {
        return p.location.split('·').trim();
      }
      return p.location.trim();
    }

    function getTypology(p, lang) {
      const cats = Array.isArray(p.categories) ? p.categories : (p.category ? [p.category] : []);
      if (!cats.length) return '';
      return cats.map(cId => {
        const found = ALL_TYPOLOGIES.find(t => t.id === cId);
        return found ? found[lang] : cId;
      }).join(', ');
    }

    /* 1. RENDER LISTADO DE PROYECTOS (CENTRADO, TÍTULO + AÑO + COORDENADAS) */
    function renderProjectsList() {
      const container = document.getElementById('projects-list-container');
      if (!container) return;

      const keys = Object.keys(projects).sort((a, b) => {
        return parseInt(projects[b].year || '0', 10) - parseInt(projects[a].year || '0', 10);
      });

      container.innerHTML = keys.map(k => {
        const p = projects[k];
        const title = getText(p.title, currentLang);
        const year = p.year || '';
        const coords = getCoordinatesOnly(p);

        return `
          <div class="project-item" onmouseenter="showHoverImage('${k}', event)" onmouseleave="hideHoverImage()">
            <a href="#${k}" onclick="openProject('${k}', event)">
              <span class="project-title">${title}</span>
              <span class="project-meta">${year} · ${coords}</span>
            </a>
          </div>
        `;
      }).join('');
    }

    /* 2. HOVER FLOTANTE EN SECO (RANDOM POS & SIZE) */
    function showHoverImage(key, e) {
      const p = projects[key];
      if (!p) return;
      const imgUrl = (p.images && p.images[0]) || p.homeImage || '';
      if (!imgUrl) return;

      const hoverBox = document.getElementById('hover-floating-image');
      const hoverImg = document.getElementById('hover-img-el');
      if (!hoverBox || !hoverImg) return;

      const randomWidth = Math.floor(280 + Math.random() * 240);
      const pad = 40;
      const maxLeft = Math.max(pad, window.innerWidth - randomWidth - pad);
      const maxTop = Math.max(pad, window.innerHeight - (randomWidth * 0.75) - pad);

      const randomLeft = Math.floor(pad + Math.random() * (maxLeft - pad));
      const randomTop = Math.floor(pad + Math.random() * (maxTop - pad));

      hoverImg.src = imgUrl;
      hoverBox.style.width = randomWidth + 'px';
      hoverBox.style.left = randomLeft + 'px';
      hoverBox.style.top = randomTop + 'px';
      hoverBox.style.display = 'block';
    }

    function hideHoverImage() {
      const hoverBox = document.getElementById('hover-floating-image');
      if (hoverBox) {
        hoverBox.style.display = 'none';
      }
    }

    /* 3. EXPEDIENTE DE PROYECTO (PROJECT DETAIL) */
    function openProject(key, e) {
      if (e) e.preventDefault();
      hideHoverImage();
      const p = projects[key];
      if (!p) return;

      currentProjectId = key;
      currentView = 'project';
      window.location.hash = key;

      const views = ['projects', 'taller', 'contact', 'home'];
      views.forEach(v => {
        const el = document.getElementById(`view-${v}`);
        if (el) el.style.display = 'none';
      });

      const projView = document.getElementById('view-project');
      projView.style.display = 'block';

      const textSec = document.getElementById('detail-text-section');
      if (textSec) {
        textSec.style.opacity = '1';
        textSec.style.pointerEvents = 'auto';
      }

      document.getElementById('nav-brand').classList.remove('active');
      document.getElementById('nav-projects').classList.add('active');
      document.getElementById('nav-taller').classList.remove('active');
      document.getElementById('nav-contact').classList.remove('active');

      const fullTitle = getText(p.title, currentLang);
      document.getElementById('detail-title').innerText = fullTitle;
      document.getElementById('detail-location').innerText = p.location || '';

      const metaContainer = document.getElementById('detail-meta');
      const metaItems = [
        { label: currentLang === 'es' ? 'Año' : 'Year', value: p.year },
        { label: currentLang === 'es' ? 'Ubicación' : 'Location', value: p.location },
        { label: currentLang === 'es' ? 'Tipología' : 'Typology', value: getTypology(p, currentLang) },
        { label: currentLang === 'es' ? 'Área' : 'Area', value: p.m2 ? (String(p.m2).includes('m') || String(p.m2).includes('sq') ? p.m2 : p.m2 + ' m²') : '' },
        { label: currentLang === 'es' ? 'Equipo' : 'Team', value: p.team },
        { label: currentLang === 'es' ? 'Programa' : 'Program', value: p.program },
        { label: currentLang === 'es' ? 'Tutor' : 'Tutor', value: p.tutor },
        { label: currentLang === 'es' ? 'Reconocimiento' : 'Distinction', value: p.distinction },
        { label: currentLang === 'es' ? 'Cliente' : 'Client', value: p.client },
        { label: currentLang === 'es' ? 'Fotografía' : 'Photography', value: p.photography }
      ];

      metaContainer.innerHTML = metaItems
        .filter(m => m.value && String(m.value).trim() !== '')
        .map(m => `
          <div class="meta-entry">
            <span class="meta-entry-label">${m.label}</span>
            <span class="meta-entry-value">${m.value}</span>
          </div>
        `).join('');

      const narrativeContainer = document.getElementById('detail-narrative');
      const summaryText = getText(p.summary, currentLang);
      const fullText = getText(p.full, currentLang);
      narrativeContainer.innerHTML = `
        ${summaryText ? `<p style="font-size: 17px; margin-bottom: 20px;">${summaryText}</p>` : ''}
        ${fullText || ''}
      `;

      const galleryContainer = document.getElementById('detail-gallery');
      const imgs = p.images || [];
      galleryContainer.innerHTML = imgs.map((url, i) => `
        <div class="image-stream-item">
          <img src="${url}" alt="${fullTitle} [${i + 1}]" loading="lazy" />
        </div>
      `).join('');

      window.scrollTo({ top: 0, behavior: 'instant' });
      handleScrollUpdates();
    }

    /* 4. TALLER */
    function renderTaller() {
      const m1 = getText(tallerData.manifesto_1, currentLang);
      const m2 = getText(tallerData.manifesto_2, currentLang);
      document.getElementById('taller-bio-text').innerHTML = `${m1}<div style="height: 20px;"></div>${m2}`;
      
      const distList = document.getElementById('taller-distinctions-list');
      if (distList && tallerData.distinctions) {
        distList.innerHTML = tallerData.distinctions.map(d => {
          const t = typeof d === 'string' ? d : getText(d, currentLang);
          return `<li style="margin-bottom: 8px;">${t}</li>`;
        }).join('');
      }

      const lblDist = document.getElementById('lbl-distinctions');
      if (lblDist) {
        lblDist.innerText = currentLang === 'es' ? 'Concursos & Distinciones' : 'Competitions & Honors';
      }
    }

    /* 5. CONTACTO */
    function renderContact() {
      const intro = getText(contactData.intro, currentLang);
      document.getElementById('contact-intro-text').innerText = intro;

      const pLink = document.getElementById('link-contact-projects');
      const prLink = document.getElementById('link-contact-press');
      const cLink = document.getElementById('link-contact-careers');

      if (contactData.emails) {
        if (pLink) { pLink.href = `mailto:${contactData.emails.projects}`; pLink.innerText = contactData.emails.projects; }
        if (prLink) { prLink.href = `mailto:${contactData.emails.press}`; prLink.innerText = contactData.emails.press; }
        if (cLink) { cLink.href = `mailto:${contactData.emails.careers}`; cLink.innerText = contactData.emails.careers; }
      }

      document.getElementById('lbl-proj-contact').innerText = currentLang === 'es' ? 'Proyectos' : 'Projects';
      document.getElementById('lbl-press-contact').innerText = currentLang === 'es' ? 'Prensa & Publicaciones' : 'Press & Publications';
      document.getElementById('lbl-careers-contact').innerText = currentLang === 'es' ? 'Vacantes' : 'Careers';
    }

    /* 6. PORTADA DISPERSA (#HOME) */
    function renderHomeScatter() {
      const container = document.getElementById('scatter-canvas-el');
      if (!container) return;

      const keys = Object.keys(projects);
      const isMobile = window.innerWidth < 768;
      const count = isMobile ? 8 : 14;

      const totalHeight = isMobile ? 2000 : 2800;
      container.style.height = totalHeight + 'px';

      const stepY = totalHeight / count;
      let html = '';

      for (let i = 0; i < count; i++) {
        const k = keys[i % keys.length];
        const p = projects[k];
        if (!p) continue;
        const img = p.homeImage || (p.images && p.images[0] ? p.images[0] : '');
        if (!img) continue;

        const width = isMobile
          ? Math.floor(160 + Math.random() * 140)
          : Math.floor(220 + Math.random() * 260);

        const maxLeft = isMobile ? (window.innerWidth - width - 30) : (container.clientWidth - width - 60);
        const left = Math.max(10, Math.floor(10 + Math.random() * Math.max(20, maxLeft)));
        const top = Math.floor(i * stepY + (Math.random() * (stepY * 0.45)));

        const aspectRatios = ['3/4', '4/3', '16/10', '1/1', '14/9'];
        const aspect = aspectRatios[Math.floor(Math.random() * aspectRatios.length)];

        html += `
          <div class="scatter-item" style="top: ${top}px; left: ${left}px; width: ${width}px; aspect-ratio: ${aspect};">
            <img src="${img}" alt="${getText(p.title, currentLang)}" loading="lazy" />
          </div>
        `;
      }

      container.innerHTML = html;
    }

    /* 7. ENRUTADOR */
    function navigateTo(target, e) {
      if (e) e.preventDefault();
      hideHoverImage();
      currentView = target;
      window.location.hash = target;

      const views = ['projects', 'taller', 'contact', 'home', 'project'];
      views.forEach(v => {
        const el = document.getElementById(`view-${v}`);
        if (el) el.style.display = 'none';
      });

      const navIds = ['brand', 'projects', 'taller', 'contact'];
      navIds.forEach(id => {
        const el = document.getElementById(`nav-${id}`);
        if (el) el.classList.remove('active');
      });

      const currentEl = document.getElementById(`view-${target}`);
      if (currentEl) currentEl.style.display = 'block';

      if (target === 'projects') {
        document.getElementById('nav-projects').classList.add('active');
        renderProjectsList();
      } else if (target === 'taller') {
        document.getElementById('nav-taller').classList.add('active');
        renderTaller();
      } else if (target === 'contact') {
        document.getElementById('nav-contact').classList.add('active');
        renderContact();
      } else if (target === 'home') {
        document.getElementById('nav-brand').classList.add('active');
        renderHomeScatter();
      }

      window.scrollTo({ top: 0, behavior: 'instant' });
      handleScrollUpdates();
    }

    function setLang(lang) {
      currentLang = lang;
      
      const btnEs = document.getElementById('btn-lang-es');
      const btnEn = document.getElementById('btn-lang-en');
      if (lang === 'es') {
        btnEs.classList.add('active');
        btnEn.classList.remove('active');
      } else {
        btnEn.classList.add('active');
        btnEs.classList.remove('active');
      }

      document.getElementById('nav-projects').innerText = lang === 'es' ? 'Proyectos' : 'Projects';
      document.getElementById('nav-taller').innerText = lang === 'es' ? 'Taller' : 'Studio';
      document.getElementById('nav-contact').innerText = lang === 'es' ? 'Contacto' : 'Contact';

      renderProjectsList();
      renderTaller();
      renderContact();

      if (currentView === 'home') {
        renderHomeScatter();
      } else if (currentView === 'project' && currentProjectId) {
        openProject(currentProjectId);
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      const halfDisk = document.getElementById('theme-half-disk');

      if (currentTheme === 'light') {
        currentTheme = 'dark';
        html.classList.remove('light');
        html.classList.add('dark');
        if (halfDisk) halfDisk.classList.remove('hidden');
      } else {
        currentTheme = 'light';
        html.classList.remove('dark');
        html.classList.add('light');
        if (halfDisk) halfDisk.classList.add('hidden');
      }
      handleScrollUpdates();
    }

    /* SCROLL & CONTRASTE */
    function handleScrollUpdates() {
      const nav = document.getElementById('header-nav');
      if (!nav) return;

      const navRect = nav.getBoundingClientRect();

      const textSec = document.getElementById('detail-text-section');
      if (textSec && currentView === 'project') {
        const rect = textSec.getBoundingClientRect();
        if (rect.bottom < 140) {
          textSec.style.opacity = '0';
          textSec.style.pointerEvents = 'none';
        } else if (rect.top < 60) {
          const factor = Math.max(0, Math.min(1, (rect.bottom - 100) / 180));
          textSec.style.opacity = factor.toFixed(2);
          textSec.style.pointerEvents = factor < 0.1 ? 'none' : 'auto';
        } else {
          textSec.style.opacity = '1';
          textSec.style.pointerEvents = 'auto';
        }
      }

      const images = document.querySelectorAll('img');
      let isOverImage = false;
      for (let i = 0; i < images.length; i++) {
        const img = images[i];
        if (img.id === 'hover-img-el') continue;
        if (!img.offsetParent) continue;
        const r = img.getBoundingClientRect();
        if (r.bottom > navRect.top + 4 && r.top < navRect.bottom - 4) {
          isOverImage = true;
          break;
        }
      }

      if (isOverImage) {
        nav.classList.add('is-over-image');
      } else {
        nav.classList.remove('is-over-image');
      }
    }

    window.addEventListener('scroll', handleScrollUpdates, { passive: true });

    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.replace('#', '');
      if (!hash || hash === 'projects' || hash === 'work') {
        navigateTo('projects');
      } else if (hash === 'taller') {
        navigateTo('taller');
      } else if (hash === 'contact') {
        navigateTo('contact');
      } else if (hash === 'home') {
        navigateTo('home');
      } else if (projects[hash]) {
        openProject(hash);
      }
    });

    window.addEventListener('resize', () => {
      if (currentView === 'home') {
        renderHomeScatter();
      }
      handleScrollUpdates();
    });

    /* SINCRONIZACIÓN SANITY CMS (PROYECTOS + TALLER + CONTACTO) */
    async function fetchSanity() {
      if (!SANITY_CONFIG.projectId) return;
      const q = encodeURIComponent(`{
        "projects": *[_type == "project"] | order(orderNumber asc, _createdAt desc) {
          _id, "slug": slug.current,
          "title": { "es": coalesce(title_es, title.es, title, "Sin título"), "en": coalesce(title_en, title.en, title, "Untitled") },
          categories, location, team, year, m2, program, tutor, distinction, client, photography,
          "summary": { "es": coalesce(summary_es, summary.es, ""), "en": coalesce(summary_en, summary.en, "") },
          "full": { "es": coalesce(full_es, full.es, ""), "en": coalesce(full_en, full.en, "") },
          "images": images[].asset->url,
          "homeImage": homeImage.asset->url
        },
        "taller": *[_type == "taller"][0] {
          "manifesto_1": { "es": coalesce(manifesto_1_es, manifesto_1.es, ""), "en": coalesce(manifesto_1_en, manifesto_1.en, "") },
          "manifesto_2": { "es": coalesce(manifesto_2_es, manifesto_2.es, ""), "en": coalesce(manifesto_2_en, manifesto_2.en, "") },
          "distinctions_title": { "es": coalesce(distinctions_title_es, "Concursos & Distinciones"), "en": coalesce(distinctions_title_en, "Competitions & Honors") },
          distinctions
        },
        "contact": *[_type == "contact"][0] {
          "intro": { "es": coalesce(intro_es, intro.es, ""), "en": coalesce(intro_en, intro.en, "") },
          "emails": { "projects": email_projects, "press": email_press, "careers": email_careers }
        }
      }`);

      try {
        const res = await fetch(`https://${SANITY_CONFIG.projectId}.api.sanity.io/v${SANITY_CONFIG.apiVersion}/data/query/${SANITY_CONFIG.dataset}?query=${q}`);
        const data = await res.json();
        if (data && data.result) {
          if (data.result.projects && data.result.projects.length) {
            const map = {};
            data.result.projects.forEach(p => {
              const k = p.slug || p._id;
              map[k] = p;
            });
            projects = map;
          }
          if (data.result.taller && data.result.taller.manifesto_1) {
            tallerData = data.result.taller;
          }
          if (data.result.contact && data.result.contact.emails) {
            contactData = data.result.contact;
          }

          renderProjectsList();
          renderTaller();
          renderContact();
          if (currentView === 'home') renderHomeScatter();
          if (currentView === 'project' && currentProjectId && projects[currentProjectId]) {
            openProject(currentProjectId);
          }
        }
      } catch (e) {
        console.log('Sanity fallback local activo.');
      }
    }

    /* INICIALIZACIÓN */
    (function init() {
      renderProjectsList();
      renderTaller();
      renderContact();
      fetchSanity();

      const hash = window.location.hash.replace('#', '');
      if (hash && hash !== 'home' && hash !== 'projects' && hash !== 'work' && hash !== 'taller' && hash !== 'contact' && projects[hash]) {
        openProject(hash);
      } else if (hash === 'taller') {
        navigateTo('taller');
      } else if (hash === 'contact') {
        navigateTo('contact');
      } else if (hash === 'home') {
        navigateTo('home');
      } else {
        navigateTo('projects');
      }
      setTimeout(handleScrollUpdates, 50);
    })();
  </script>
</body>
</html>
