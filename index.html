<!DOCTYPE html>
<html lang="es" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Cgm Atelier — </title>
  <meta name="description" content="CGM Atelier — Práctica de arquitectura y territorio. Monterrey, México." />

  <!-- Declaración de fuentes: ABC Diatype (local y web fallback) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'ABC Diatype';
      src: local('ABC Diatype Regular'), local('ABCDiatype-Regular'), local('ABC Diatype'), local('ABCDiatype'),
           url('./fonts/ABC Diatype.woff2') format('woff2'),
           url('./fonts/ABCDiatype-Regular.woff2') format('woff2'),
           url('./fonts/ABCDiatype.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'ABC Diatype';
      src: local('ABC Diatype Medium'), local('ABCDiatype-Medium'),
           url('./fonts/ABC Diatype.woff2') format('woff2'),
           url('./fonts/ABCDiatype-Medium.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'ABC Diatype';
      src: local('ABC Diatype Bold'), local('ABCDiatype-Bold'),
           url('./fonts/ABCDiatype-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

:root {
      --bg: #ffffff;
      --text: #000000;
      --muted: #888888;
      --blue: #D95B21;
      --accent: #D95B21;
      --font: "ABC Diatype", "Geist", "Suisse Intl", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --pad-x: 24px;
      --pad-top: 22px;
    }

    html.dark {
      --bg: #0a0a0a;
      --text: #f5f5f5;
      --muted: #808080;
      --blue: #D95B21;
      --accent: #D95B21;
    }

    @media (min-width: 768px) {
      :root {
        --pad-x: 40px;
        --pad-top: 28px;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border: 0;
      outline: 0;
      text-shadow: none !important;
      box-shadow: none !important;
    }

::selection {
      background-color: #D95B21;
      color: #ffffff;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: -0.015em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    a, button {
      color: inherit;
      text-decoration: none;
      background: none;
      cursor: pointer;
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      transition: color 0.1s ease;
    }

    a:hover, button:hover {
      color: var(--accent) !important;
    }

    .active, a.active, button.active {
      color: var(--accent) !important;
    }

    /* CABECERA FIJA SUPERIOR */
    nav#header-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 500;
      padding: var(--pad-top) var(--pad-x);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      background: transparent;
      pointer-events: none;
      transition: color 0.15s ease, filter 0.15s ease;
    }

    nav#header-nav * {
      pointer-events: auto;
    }

    /* Adaptación del menú cuando pasa sobre una imagen: escala de grises y texto blanco sin sombras */
    nav#header-nav.is-over-image,
    nav#header-nav.is-over-image a,
    nav#header-nav.is-over-image button {
      color: #ffffff !important;
      filter: grayscale(100%);
    }

    nav#header-nav.is-over-image a:hover,
    nav#header-nav.is-over-image button:hover {
      color: var(--accent) !important;
      filter: none;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.025em;
    }

    @media (min-width: 768px) {
      .brand-title {
        font-size: 24px;
      }
    }

    .nav-links {
      display: flex;
      align-items: baseline;
      gap: 18px;
      font-size: 16px;
      font-weight: 500;
    }

    @media (min-width: 768px) {
      .nav-links {
        gap: 26px;
      }
    }

    /* CONTROLES ABAJO A LA DERECHA (ES/EN Y MODO DE COLOR) */
    #bottom-controls {
      position: fixed;
      bottom: 24px;
      right: var(--pad-x);
      z-index: 500;
      display: flex;
      align-items: center;
      gap: 16px;
      pointer-events: auto;
      font-size: 13px;
      font-weight: 500;
      transition: color 0.15s ease, filter 0.15s ease;
    }

    #bottom-controls.is-over-image,
    #bottom-controls.is-over-image button {
      color: #ffffff !important;
      filter: grayscale(100%);
    }

    #bottom-controls.is-over-image button:hover {
      color: var(--accent) !important;
      filter: none;
    }

    .lang-switcher {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .lang-btn {
      color: var(--muted);
    }

    .lang-btn.active {
      color: var(--text) !important;
      font-weight: 600;
    }

    .lang-btn:hover {
      color: var(--accent) !important;
    }

    .theme-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
      color: var(--muted);
    }

    .theme-icon-btn:hover {
      color: var(--accent) !important;
    }

    /* CONTENEDOR PRINCIPAL CON ESPACIO SUPERIOR AMPLIO */
    main#content {
      padding-top: 130px;
      padding-left: var(--pad-x);
      padding-right: var(--pad-x);
      padding-bottom: 120px;
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
    }

    @media (min-width: 768px) {
      main#content {
        padding-top: 150px;
      }
    }

    /* =========================================================
       1. PORTADA DISPERSA EN ZONAS RANDOM Y SEPARADAS
       ========================================================= */
    #view-home {
      cursor: pointer;
      position: relative;
      width: 100%;
      min-height: 220vh;
      margin-top: -30px;
    }

    .scatter-canvas {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 220vh;
    }

    .scatter-item {
      position: absolute;
      background-color: rgba(128, 128, 128, 0.15);
      overflow: hidden;
      display: block;
      transition: opacity 0.15s ease;
      cursor: pointer;
    }

    .scatter-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .scatter-item:hover {
      opacity: 0.88;
    }

/* =========================================================
       2. LISTADO DE PROYECTOS (ESTILO GIRODENGO: 2 COLUMNAS)
       ========================================================= */
    #view-work {
      max-width: 1320px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 48px;
      align-items: end;
    }

    @media (min-width: 1024px) {
      #view-work {
        grid-template-columns: 1.6fr 1fr;
        gap: 64px;
      }
    }

    /* FILA TABULAR: COORDENADAS — TÍTULO — TIPOLOGÍA */
    .project-item {
      display: block;
      width: 100%;
      cursor: pointer;
      line-height: 1.45;
    }

    .project-item a {
      display: grid;
      grid-template-columns: 140px 1fr auto;
      align-items: baseline;
      gap: 16px;
      width: 100%;
      padding: 3px 0;
      color: var(--text);
      font-size: 14.5px;
      transition: color 0.1s ease;
    }

    @media (max-width: 640px) {
      .project-item a {
        grid-template-columns: 1fr;
        gap: 2px;
        padding: 8px 0;
      }
    }

    .project-coords {
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      letter-spacing: -0.01em;
    }

    .project-title {
      font-size: 15px;
      font-weight: 400;
      letter-spacing: -0.015em;
    }

    .project-typology {
      font-size: 13.5px;
      color: var(--muted);
      text-align: right;
      white-space: nowrap;
      letter-spacing: -0.01em;
    }

    .project-item:hover a,
    .project-item:hover .project-title,
    .project-item:hover .project-coords,
    .project-item:hover .project-typology {
      color: var(--accent) !important;
    }

    /* COLUMNA DERECHA: BIO EDITORIAL */
    .side-studio-bio {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
      max-width: 440px;
      padding-bottom: 6px;
    }

    .side-studio-bio p {
      margin-bottom: 14px;
    }

    /* IMAGEN FLOTANTE EN HOVER: EN SECO, RANDOM POS & RANDOM SIZE */
    #hover-floating-image {
      position: fixed;
      pointer-events: none;
      z-index: 450;
      display: none;
      transition: none !important;
      animation: none !important;
    }

    #hover-floating-image img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
      background-color: rgba(128, 128, 128, 0.2);
      transition: none !important;
      animation: none !important;
    }

    /* =========================================================
       3. EXPEDIENTE DE PROYECTO (PROJECT DETAIL)
       ========================================================= */
    #view-project {
      max-width: 1080px;
    }

    #detail-text-section {
      transition: opacity 0.25s ease;
      will-change: opacity;
    }

    .detail-hero-title {
      font-size: 32px;
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.025em;
      margin-bottom: 8px;
      color: var(--text);
    }

    @media (min-width: 768px) {
      .detail-hero-title {
        font-size: 46px;
      }
    }

    .detail-location-sub {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .meta-layout {
      display: flex;
      flex-wrap: wrap;
      gap: 20px 48px;
      margin-bottom: 40px;
      font-size: 15px;
      line-height: 1.4;
    }

    .meta-entry {
      display: flex;
      flex-direction: column;
    }

    .meta-entry-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 2px;
    }

    .meta-entry-value {
      color: var(--text);
      font-weight: 400;
    }

    .detail-description {
      font-size: 16px;
      line-height: 1.6;
      max-width: 820px;
      margin-bottom: 56px;
      color: var(--text);
    }

    .detail-description p {
      margin-bottom: 16px;
    }

    .image-stream {
      display: flex;
      flex-direction: column;
      gap: 40px;
      margin-top: 40px;
    }

    @media (min-width: 768px) {
      .image-stream {
        gap: 64px;
      }
    }

    .image-stream-item {
      width: 100%;
    }

    .image-stream-item img {
      width: 100%;
      height: auto;
      display: block;
      background-color: rgba(128, 128, 128, 0.15);
    }

    /* =========================================================
       4. TALLER / INFO (+)
       ========================================================= */
    #view-info {
      max-width: 820px;
    }

    .info-bio {
      font-size: 18px;
      line-height: 1.55;
      margin-bottom: 44px;
      color: var(--text);
    }

    @media (min-width: 768px) {
      .info-bio {
        font-size: 20px;
        line-height: 1.5;
        margin-bottom: 56px;
      }
    }

    .info-bio p {
      margin-bottom: 20px;
    }

    .info-bio strong {
      font-weight: 500;
      color: var(--text);
    }

    .info-section-title {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .info-list {
      list-style: none;
      margin-bottom: 44px;
      font-size: 15px;
      line-height: 1.6;
    }

    /* =========================================================
       5. CONTACTO
       ========================================================= */
    #view-contact {
      max-width: 820px;
    }

    .contact-intro {
      font-size: 18px;
      line-height: 1.55;
      margin-bottom: 36px;
      color: var(--text);
    }

    .contact-channels {
      display: flex;
      flex-direction: column;
      gap: 16px;
      font-size: 16px;
    }

    .contact-channel-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .contact-channel-label {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .contact-channel-item a {
      color: var(--text);
    }

    .contact-channel-item a:hover {
      color: var(--accent) !important;
    }

    .hidden { display: none !important; }
    .block { display: block !important; }

    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>

  <!-- CABECERA FIJA SUPERIOR LIMPIA (SOLO LOGO, WORK, + TALLER, CONTACTO) -->
<nav id="header-nav">
    <div>
      <a href="#home" onclick="navigateTo('home', event)" id="nav-brand" class="brand-title">CGM Atelier</a>
    </div>

    <div class="nav-links">
      <a href="#work" onclick="navigateTo('work', event)" id="nav-work">Work</a>
      <a href="#info" onclick="navigateTo('info', event)" id="nav-info">+ Taller</a>
      <a href="#contact" onclick="navigateTo('contact', event)" id="nav-contact">Contacto</a>
    </div>
  </nav>

  <!-- CONTROLES INFERIORES DERECHOS: ES/EN Y MODO DE COLOR -->
  <div id="bottom-controls">
    <div class="lang-switcher">
      <button onclick="setLang('es')" id="btn-lang-es" class="lang-btn active">ES</button>
      <span style="color: var(--muted); opacity: 0.5;">/</span>
      <button onclick="setLang('en')" id="btn-lang-en" class="lang-btn">EN</button>
    </div>

<button onclick="toggleTheme()" id="btn-theme" title="Cambiar tema" class="theme-icon-btn">
        <svg id="icon-circle" class="w-3.5 h-3.5 stroke-current fill-none block" style="width: 13px; height: 13px;" viewBox="0 0 24 24" stroke-width="1.6"><circle cx="12" cy="12" r="9" /></svg>
        <svg id="icon-half" class="w-3.5 h-3.5 stroke-current fill-none hidden" style="width: 13px; height: 13px;" viewBox="0 0 24 24" stroke-width="1.6"><circle cx="12" cy="12" r="9" /><path fill="currentColor" d="M12 3a9 9 0 0 0 0 18V3z" /></svg>
      </button>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <main id="content">
    
    <!-- VISTA 1: PORTADA DISPERSA EN ZONAS RANDOM -->
    <section id="view-home" onclick="navigateTo('work', event)">
      <div class="scatter-canvas" id="scatter-canvas-el"></div>
    </section>

    <!-- VISTA 2: LISTADO DE PROYECTOS (WORK) -->
    <section id="view-work" style="display: none;">
      
      <!-- Barra minimalista de búsqueda y filtros -->
      <div class="filter-search-bar">
        <div class="search-input-wrapper">
          <input type="text" id="project-search-input" oninput="handleSearchInput(this.value)" placeholder="buscar proyecto..." autocomplete="off" />
        </div>
        <div class="typology-filter-group" id="typology-filter-container">
          <!-- Inyectado dinámicamente -->
        </div>
      </div>

      <!-- Contenedor del listado -->
      <div id="projects-list-container"></div>
    </section>

    <!-- VISTA 3: EXPEDIENTE DE PROYECTO (PROJECT DETAIL) -->
    <article id="view-project" style="display: none;">
      <div id="detail-text-section">
        <h1 id="detail-title" class="detail-hero-title"></h1>
        <div id="detail-location" class="detail-location-sub"></div>
        <div id="detail-meta" class="meta-layout"></div>
        <div id="detail-narrative" class="detail-description"></div>
      </div>
      <div id="detail-gallery" class="image-stream"></div>
    </article>

    <!-- VISTA 4: INFORMACIÓN / TALLER (+ TALLER) -->
    <section id="view-info" style="display: none;">
      <div id="info-bio-text" class="info-bio"></div>
      <div>
        <div class="info-section-title" id="lbl-distinctions">reconocimientos & concursos</div>
        <ul id="info-distinctions-list" class="info-list"></ul>
      </div>
    </section>

    <!-- VISTA 5: CONTACTO -->
    <section id="view-contact" style="display: none;">
      <p id="contact-intro-text" class="contact-intro"></p>
      <div class="contact-channels">
        <div class="contact-channel-item">
          <span class="contact-channel-label" id="lbl-proj-contact">Proyectos</span>
          <a id="link-contact-projects" href="mailto:info@cgmatelier.com">info@cgmatelier.com</a>
        </div>
        <div class="contact-channel-item">
          <span class="contact-channel-label" id="lbl-press-contact">Prensa & Publicaciones</span>
          <a id="link-contact-press" href="mailto:press@cgmatelier.com">press@cgmatelier.com</a>
        </div>
        <div class="contact-channel-item">
          <span class="contact-channel-label" id="lbl-careers-contact">Vacantes</span>
          <a id="link-contact-careers" href="mailto:vacantes@cgmatelier.com">vacantes@cgmatelier.com</a>
        </div>
        <div style="color: var(--muted); margin-top: 14px; font-size: 14px;">Monterrey, México</div>
      </div>
    </section>

  </main>

  <!-- IMAGEN FLOTANTE EN HOVER (EN SECO, RANDOM POS & RANDOM SIZE) -->
  <div id="hover-floating-image">
    <img id="hover-img-el" src="" alt="preview" />
  </div>

        function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function getText(obj, lang) {
      if (!obj) return '';
      if (typeof obj === 'string') return obj;
      return obj[lang] || obj['es'] || obj['en'] || '';
    }

    function getCoordinatesOnly(p) {
      if (!p || !p.location) return '';
      const locStr = typeof p.location === 'object' ? (p.location[currentLang] || p.location.es || p.location.en || '') : String(p.location);
      if (locStr.includes('·')) {
        const parts = locStr.split('·');
        return parts.length > 1 ? parts[1].trim() : parts[0].trim();
      }
      return locStr.trim();
    }

    function getTypology(p, lang) {
      const custom = getText(p.typology, lang);
      if (custom && custom.trim() !== '') return custom;

      const cats = Array.isArray(p.categories) ? p.categories : (p.category ? [p.category] : []);
      if (!cats.length) return '';
      return cats.map(cId => {
        const found = ALL_TYPOLOGIES.find(t => t.id === cId);
        return found ? found[lang] : cId;
      }).join(', ');
    }

    function formatTallerParagraphs(rawText) {
      if (!rawText) return '';
      if (rawText.includes('<p>') || rawText.includes('<div>')) return rawText;
      return rawText
        .split(new RegExp('\\n\\s*\\n'))
        .map(p => p.trim())
        .filter(p => p.length > 0)
        .map(p => '<p>' + p + '</p>')
        .join('');
    }

    function slugify(text) {
      if (!text) return '';
      return text
        .toString()
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/(^-|-$)+/g, '');
    }

    function findProjectKey(id) {
      if (!id) return null;
      if (projects[id]) return id;
      const found = Object.keys(projects).find(k => {
        const p = projects[k];
        return p._id === id || p.id === id || p.slug === id || p.slugKey === id;
      });
      return found || id;
    }

    function getProjectImage(p) {
      if (!p) return '';
      if (p.homeImage && typeof p.homeImage === 'string') return p.homeImage;
      if (p.images && p.images.length > 0 && typeof p.images[0] === 'string') return p.images[0];
      if (p.gallery && p.gallery.length > 0) {
        const first = p.gallery.find(item => typeof item === 'string' || (item && item.url));
        if (first) return typeof first === 'string' ? first : first.url;
      }
      return '';
    }

        const p = projects[k];
        if (!p) return;
        const candidates = [p.homeImage, ...(Array.isArray(p.images) ? p.images : [])].filter(Boolean);
        candidates.forEach(url => {
          if (!seenUrls.has(url)) {
            seenUrls.add(url);
            pool.push({ key: k, title: p.title, url });
          }
        });
      });

      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }

      const isMobile = window.innerWidth < 768;
      const count = Math.min(pool.length, isMobile ? 8 : 14);

      const totalHeight = isMobile ? 2000 : 2800;
      container.style.height = totalHeight + 'px';

      const stepY = totalHeight / Math.max(count, 1);
      let html = '';

      const availableWidth = Math.max(300, Math.min(window.innerWidth, 1320));

      for (let i = 0; i < count; i++) {
        const entry = pool[i];
        if (!entry) continue;
        const img = entry.url;
        if (!img) continue;
        const p = { title: entry.title };

        const width = isMobile
          ? Math.floor(160 + Math.random() * 140)
          : Math.floor(220 + Math.random() * 260);

        const maxLeft = Math.max(20, availableWidth - width - 40);
        const left = Math.max(10, Math.floor(10 + Math.random() * maxLeft));
        const top = Math.floor(i * stepY + (Math.random() * (stepY * 0.45)));

        const aspectRatios = ['3/4', '4/3', '16/10', '1/1', '14/9'];
        const aspect = aspectRatios[Math.floor(Math.random() * aspectRatios.length)];

        html += `
          <div class="scatter-item" style="top: ${top}px; left: ${left}px; width: ${width}px; aspect-ratio: ${aspect};">
            <img src="${img}" alt="${escapeHtml(getText(p.title, currentLang))}" loading="lazy" />
          </div>
        `;
      }

      container.innerHTML = html;
    }

    /* =========================================================
       2. FILTROS POR TIPOLOGÍA Y BÚSQUEDA
       ========================================================= */
    function renderFilters() {
      const container = document.getElementById('typology-filter-container');
      if (!container) return;

      const allLabel = currentLang === 'es' ? 'todos' : 'all';
      let html = `<button onclick="setFilter('all')" class="${currentFilter === 'all' ? 'active' : ''}">${allLabel}</button>`;

      ALL_TYPOLOGIES.forEach(t => {
        const label = t[currentLang];
        const isActive = (currentFilter === t.id);
        html += `<button onclick="setFilter('${t.id}')" class="${isActive ? 'active' : ''}">${label}</button>`;
      });

      container.innerHTML = html;

      const searchEl = document.getElementById('project-search-input');
      if (searchEl) {
        searchEl.placeholder = currentLang === 'es' ? 'buscar proyecto...' : 'search project...';
      }
    }

    function setFilter(catId) {
      currentFilter = catId;
      renderFilters();
      renderWorkList();
    }

    function handleSearchInput(query) {
      currentSearch = (query || '').trim().toLowerCase();
      renderWorkList();
    }

    /* =========================================================
       3. LISTADO DE PROYECTOS (TÍTULO GRANDE + AÑO Y COORDENADAS)
       ========================================================= */
function renderWorkList() {
      const container = document.getElementById('projects-list-container');
      const bioContainer = document.getElementById('work-side-bio');
      if (!container) return;

      const keys = Object.keys(projects).sort((a, b) => {
        return parseInt(projects[b].year || '0', 10) - parseInt(projects[a].year || '0', 10);
      });

      // 1. Render de las 3 columnas: Coordenadas — Título — Tipología
      container.innerHTML = keys.map(k => {
        const p = projects[k];
        if (!p) return '';
        const title = getText(p.title, currentLang);
        const coords = getCoordinatesOnly(p);
        const typology = getTypology(p, currentLang);

        return `
          <div class="project-item" onmouseenter="showHoverImage('${k}', event)" onmouseleave="hideHoverImage()">
            <a href="#${k}" onclick="openProject('${k}', event)">
              <span class="project-coords">${coords}</span>
              <span class="project-title">${title}</span>
              <span class="project-typology">${typology}</span>
            </a>
          </div>
        `;
      }).join('');

      // 2. Render de la bio editorial en la columna derecha
      if (bioContainer && tallerData) {
        bioContainer.innerHTML = `
          <p>${formatTallerParagraphs(getText(tallerData.manifesto_1, currentLang))}</p>
        `;
      }
    }

    /* =========================================================
       4. IMAGEN FLOTANTE EN HOVER: EN SECO, RANDOM POS & SIZE
       ========================================================= */
    function showHoverImage(key, e) {
      const resolvedKey = findProjectKey(key);
      const p = projects[resolvedKey];
      if (!p) return;

      const imgUrl = getProjectImage(p);
      if (!imgUrl) return;

      const hoverBox = document.getElementById('hover-floating-image');
      const hoverImg = document.getElementById('hover-img-el');
      if (!hoverBox || !hoverImg) return;

      const randomWidth = Math.floor(280 + Math.random() * 240);
      const pad = 40;
      const maxLeft = Math.max(pad, window.innerWidth - randomWidth - pad);
      const maxTop = Math.max(pad, window.innerHeight - (randomWidth * 0.75) - pad);

      const randomLeft = Math.floor(pad + Math.random() * (maxLeft - pad));
      const randomTop = Math.floor(pad + Math.random() * (maxTop - pad));

      hoverImg.src = imgUrl;
      hoverBox.style.width = randomWidth + 'px';
      hoverBox.style.left = randomLeft + 'px';
      hoverBox.style.top = randomTop + 'px';
      hoverBox.style.display = 'block';
    }

    function hideHoverImage() {
      const hoverBox = document.getElementById('hover-floating-image');
      if (hoverBox) {
        hoverBox.style.display = 'none';
      }
    }

    /* =========================================================
       5. EXPEDIENTE DE PROYECTO (PROJECT DETAIL)
       ========================================================= */
    function openProject(key, e) {
      if (e) e.preventDefault();
      hideHoverImage();
      const resolvedKey = findProjectKey(key);
      const p = projects[resolvedKey];
      if (!p) return;

      currentProjectId = resolvedKey;
      currentView = 'project';
      window.location.hash = resolvedKey;

      document.getElementById('view-home').style.display = 'none';
      document.getElementById('view-work').style.display = 'none';
      document.getElementById('view-info').style.display = 'none';
      document.getElementById('view-contact').style.display = 'none';
      
      const projView = document.getElementById('view-project');
      projView.style.display = 'block';

      const textSec = document.getElementById('detail-text-section');
      if (textSec) {
        textSec.style.opacity = '1';
        textSec.style.pointerEvents = 'auto';
      }

      document.getElementById('nav-brand').classList.remove('active');
      document.getElementById('nav-work').classList.add('active');
      document.getElementById('nav-info').classList.remove('active');
      document.getElementById('nav-contact').classList.remove('active');

      const fullTitle = getText(p.title, currentLang);
      document.getElementById('detail-title').innerText = fullTitle;
      document.getElementById('detail-location').innerText = p.location || '';

      const metaContainer = document.getElementById('detail-meta');
      const metaItems = [
        { label: currentLang === 'es' ? 'año' : 'year', value: p.year },
        { label: currentLang === 'es' ? 'ubicación' : 'location', value: p.location },
        { label: currentLang === 'es' ? 'tipología' : 'typology', value: getTypology(p, currentLang) },
        { label: currentLang === 'es' ? 'área' : 'area', value: p.m2 ? (String(p.m2).includes('m') || String(p.m2).includes('sq') ? p.m2 : p.m2 + ' m²') : '' },
        { label: currentLang === 'es' ? 'equipo' : 'team', value: p.team },
        { label: currentLang === 'es' ? 'programa' : 'program', value: p.program },
        { label: currentLang === 'es' ? 'tutor' : 'tutor', value: p.tutor },
        { label: currentLang === 'es' ? 'reconocimiento' : 'distinction', value: p.distinction },
        { label: currentLang === 'es' ? 'cliente' : 'client', value: p.client },
        { label: currentLang === 'es' ? 'fotografía' : 'photography', value: p.photography }
      ];

      metaContainer.innerHTML = metaItems
        .filter(m => m.value && String(m.value).trim() !== '')
        .map(m => `
          <div class="meta-entry">
            <span class="meta-entry-label">${m.label}</span>
            <span class="meta-entry-value">${m.value}</span>
          </div>
        `).join('');

      const narrativeContainer = document.getElementById('detail-narrative');
      const summaryText = getText(p.summary, currentLang);
      const fullText = getText(p.full, currentLang);
      narrativeContainer.innerHTML = `
        ${summaryText ? `<p style="font-size: 17px; margin-bottom: 20px;">${summaryText}</p>` : ''}
        ${fullText || ''}
      `;

      const galleryContainer = document.getElementById('detail-gallery');
      const rawGallery = (p.gallery && p.gallery.length > 0) ? p.gallery : (p.images || []);
      
      let htmlOutput = [];
      rawGallery.forEach((item, idx) => {
        if (typeof item === 'string') {
          htmlOutput.push(`
            <div class="image-stream-item">
              <img src="${item}" alt="${fullTitle} [${idx + 1}]" loading="lazy" />
            </div>
          `);
        } else if (item && (item._type === 'explanatoryText' || ('text_es' in item && !item.url))) {
          const txt = (currentLang === 'es' ? (item.text_es || item.text_en) : (item.text_en || item.text_es)) || '';
          if (txt) {
            htmlOutput.push(`
              <div class="detail-description">
                <p>${txt}</p>
              </div>
            `);
          }
        } else if (item && item.url) {
          const cap = (currentLang === 'es' ? (item.caption_es || item.caption_en) : (item.caption_en || item.caption_es)) || '';
          htmlOutput.push(`
            <div class="image-stream-item">
              <img src="${item.url}" alt="${fullTitle} [${idx + 1}]" loading="lazy" />
              ${cap ? `<div style="font-size: 13px; color: var(--muted); margin-top: 8px;">${cap}</div>` : ''}
            </div>
          `);
        }
      });

      galleryContainer.innerHTML = htmlOutput.join('');
      window.scrollTo({ top: 0, behavior: 'instant' });
      handleScrollUpdates();
    }

    /* =========================================================
       6. TALLER / INFO (+)
       ========================================================= */
    function renderInfoView() {
      const m1 = formatTallerParagraphs(getText(tallerData.manifesto_1, currentLang));
      const m2 = formatTallerParagraphs(getText(tallerData.manifesto_2, currentLang));
      document.getElementById('info-bio-text').innerHTML = `${m1}<div style="height: 20px;"></div>${m2}`;
      
      const distList = document.getElementById('info-distinctions-list');
      if (distList && tallerData.distinctions) {
        distList.innerHTML = tallerData.distinctions.map(d => {
          const t = typeof d === 'string' ? d : getText(d, currentLang);
          return `<li style="margin-bottom: 8px;">${t}</li>`;
        }).join('');
      }

      const lblDist = document.getElementById('lbl-distinctions');
      if (lblDist) {
        const customTitle = getText(tallerData.distinctions_title, currentLang);
        lblDist.innerText = customTitle || (currentLang === 'es' ? 'reconocimientos & concursos' : 'honors & competitions');
      }
    }

    /* =========================================================
       7. CONTACTO
       ========================================================= */
    function renderContact() {
      const intro = document.getElementById('contact-intro-text');
      const pLink = document.getElementById('link-contact-projects');
      const prLink = document.getElementById('link-contact-press');
      const cLink = document.getElementById('link-contact-careers');

      if (intro) intro.innerText = getText(contactData.intro, currentLang);

      if (contactData && contactData.emails) {
        if (pLink && contactData.emails.projects) {
          pLink.href = `mailto:${contactData.emails.projects}`;
          pLink.innerText = contactData.emails.projects;
        }
        if (prLink && contactData.emails.press) {
          prLink.href = `mailto:${contactData.emails.press}`;
          prLink.innerText = contactData.emails.press;
        }
        if (cLink && contactData.emails.careers) {
          cLink.href = `mailto:${contactData.emails.careers}`;
          cLink.innerText = contactData.emails.careers;
        }
      }

      const lblProj = document.getElementById('lbl-proj-contact');
      const lblPress = document.getElementById('lbl-press-contact');
      const lblCar = document.getElementById('lbl-careers-contact');
      if (lblProj) lblProj.innerText = currentLang === 'es' ? 'Proyectos' : 'Projects';
      if (lblPress) lblPress.innerText = currentLang === 'es' ? 'Prensa & Publicaciones' : 'Press & Publications';
      if (lblCar) lblCar.innerText = currentLang === 'es' ? 'Vacantes' : 'Careers';
    }

    /* =========================================================
       8. ENRUTADOR, SCROLL Y CONTRASTE ADAPTATIVO
       ========================================================= */
function navigateTo(target, e) {
      if (e) e.preventDefault();
      hideHoverImage();
      currentView = target;
      window.location.hash = target;

      const vHome = document.getElementById('view-home');
      const vWork = document.getElementById('view-work');
      const vInfo = document.getElementById('view-info');
      const vContact = document.getElementById('view-contact');
      const vProj = document.getElementById('view-project');
      const nBrand = document.getElementById('nav-brand');
      const nWork = document.getElementById('nav-work');
      const nInfo = document.getElementById('nav-info');
      const nContact = document.getElementById('nav-contact');

      vHome.style.display = 'none';
      vWork.style.display = 'none';
      vInfo.style.display = 'none';
      vContact.style.display = 'none';
      vProj.style.display = 'none';

      nBrand.classList.remove('active');
      nWork.classList.remove('active');
      nInfo.classList.remove('active');
      nContact.classList.remove('active');

      if (target === 'home') {
        vHome.style.display = 'block';
        nBrand.classList.add('active');
        renderHomeScatter();
      } else if (target === 'work') {
        vWork.style.display = 'block';
        nWork.classList.add('active');
        renderFilters();
        renderWorkList();
      } else if (target === 'info') {
        vInfo.style.display = 'block';
        nInfo.classList.add('active');
        renderInfoView();
      } else if (target === 'contact') {
        vContact.style.display = 'block';
        nContact.classList.add('active');
        renderContact();
      }

      window.scrollTo({ top: 0, behavior: 'instant' });
      handleScrollUpdates();
    }

function setLang(lang) {
      currentLang = lang;
      
      const btnEs = document.getElementById('btn-lang-es');
      const btnEn = document.getElementById('btn-lang-en');
      if (lang === 'es') {
        if (btnEs) btnEs.classList.add('active');
        if (btnEn) btnEn.classList.remove('active');
      } else {
        if (btnEn) btnEn.classList.add('active');
        if (btnEs) btnEs.classList.remove('active');
      }

      const nWork = document.getElementById('nav-work');
      const nInfo = document.getElementById('nav-info');
      const nContact = document.getElementById('nav-contact');
      if (nWork) nWork.innerText = lang === 'es' ? 'Work' : 'Work';
      if (nInfo) nInfo.innerText = lang === 'es' ? '+ Taller' : '+ Studio';
      if (nContact) nContact.innerText = lang === 'es' ? 'Contacto' : 'Contact';

      renderFilters();
      renderWorkList();
      renderInfoView();
      renderContact();

      if (currentView === 'home') {
        renderHomeScatter();
      } else if (currentView === 'project' && currentProjectId) {
        openProject(currentProjectId);
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      const ic = document.getElementById('icon-circle');
      const ih = document.getElementById('icon-half');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        html.classList.add('light');
        currentTheme = 'light';
        if (ic) ic.classList.remove('hidden');
        if (ih) ih.classList.add('hidden');
      } else {
        html.classList.remove('light');
        html.classList.add('dark');
        currentTheme = 'dark';
        if (ic) ic.classList.add('hidden');
        if (ih) ih.classList.remove('hidden');
      }
      handleScrollUpdates();
    }

    /* DETECCIÓN DE SCROLL: FADE OUT DE TEXTO Y CONTRASTE SOBRE IMÁGENES */
    function handleScrollUpdates() {
      const nav = document.getElementById('header-nav');
      const bottomCtrl = document.getElementById('bottom-controls');
      if (!nav) return;

      const navRect = nav.getBoundingClientRect();
      const bottomRect = bottomCtrl ? bottomCtrl.getBoundingClientRect() : null;

      // 1. Desvanecer el texto del proyecto al scrollear hacia las fotos
      const textSec = document.getElementById('detail-text-section');
      if (textSec && currentView === 'project' && typeof textSec.getBoundingClientRect === 'function') {
        const rect = textSec.getBoundingClientRect();
        if (rect.bottom < 140) {
          textSec.style.opacity = '0';
          textSec.style.pointerEvents = 'none';
        } else if (rect.top < 60) {
          const factor = Math.max(0, Math.min(1, (rect.bottom - 100) / 180));
          textSec.style.opacity = factor.toFixed(2);
          textSec.style.pointerEvents = factor < 0.1 ? 'none' : 'auto';
        } else {
          textSec.style.opacity = '1';
          textSec.style.pointerEvents = 'auto';
        }
      }

      // 2. Detección de contraste: si el menú o los controles pasan sobre alguna imagen visible
      const images = document.querySelectorAll('img');
      let isNavOverImage = false;
      let isBottomOverImage = false;

      for (let i = 0; i < images.length; i++) {
        const img = images[i];
        if (img.id === 'hover-img-el') continue;
        if (!img.offsetParent) continue;
        const r = img.getBoundingClientRect();
        if (r.bottom > navRect.top + 4 && r.top < navRect.bottom - 4) {
          isNavOverImage = true;
        }
        if (bottomRect && r.bottom > bottomRect.top + 4 && r.top < bottomRect.bottom - 4 && r.right > bottomRect.left + 4 && r.left < bottomRect.right - 4) {
          isBottomOverImage = true;
        }
      }

      if (isNavOverImage) {
        nav.classList.add('is-over-image');
      } else {
        nav.classList.remove('is-over-image');
      }

      if (bottomCtrl) {
        if (isBottomOverImage) {
          bottomCtrl.classList.add('is-over-image');
        } else {
          bottomCtrl.classList.remove('is-over-image');
        }
      }
    }

    window.addEventListener('scroll', handleScrollUpdates, { passive: true });

    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.replace('#', '');
      if (!hash || hash === 'home') {
        navigateTo('home');
      } else if (hash === 'work') {
        navigateTo('work');
      } else if (hash === 'info' || hash === 'taller') {
        navigateTo('info');
      } else if (hash === 'contact' || hash === 'contacto') {
        navigateTo('contact');
      } else if (findProjectKey(hash)) {
        openProject(hash);
      }
    });

    window.addEventListener('resize', () => {
      if (currentView === 'home') {
        renderHomeScatter();
      }
      handleScrollUpdates();
    });

    // Sincronización Sanity CMS
    async function fetchSanity() {
      if (!SANITY_CONFIG.projectId) return;
      const q = encodeURIComponent(`{
        "projects": *[_type == "project"] | order(orderNumber asc, _createdAt desc) {
          _id, "id": _id,
          "slug": slug.current,
          selectedWork,
          categories,
          "homeImage": homeImage.asset->url,
          "title": { "es": coalesce(title_es, title.es, title, orderNumber, "Sin título"), "en": coalesce(title_en, title.en, title, orderNumber, "Untitled") },
          "typology": { "es": coalesce(typology_es, typology.es, ""), "en": coalesce(typology_en, typology.en, "") },
          location, team, year, m2, program, tutor, distinction, client, photography,
          "summary": { "es": coalesce(summary_es, summary.es, ""), "en": coalesce(summary_en, summary.en, "") },
          "full": { "es": coalesce(full_es, full.es, ""), "en": coalesce(full_en, full.en, "") },
          "gallery": gallery[] {
            _type,
            "url": asset->url,
            layout,
            caption_es,
            caption_en,
            text_es,
            text_en
          },
          "images": images[].asset->url
        },
        "taller": *[_type == "taller"][0] {
          "manifesto_1": { "es": coalesce(manifesto_1_es, manifesto_1.es, ""), "en": coalesce(manifesto_1_en, manifesto_1.en, "") },
          "manifesto_2": { "es": coalesce(manifesto_2_es, manifesto_2.es, ""), "en": coalesce(manifesto_2_en, manifesto_2.en, "") },
          "distinctions_title": { "es": coalesce(distinctions_title_es, "Concursos & Distinciones"), "en": coalesce(distinctions_title_en, "Competitions & Honors") },
          distinctions
        },
        "contact": *[_type == "contact"][0] {
          "intro": { "es": coalesce(intro_es, intro.es, ""), "en": coalesce(intro_en, intro.en, "") },
          "emails": { "projects": email_projects, "press": email_press, "careers": email_careers }
        }
      }`);

      try {
        const res = await fetch(`https://${SANITY_CONFIG.projectId}.api.sanity.io/v${SANITY_CONFIG.apiVersion}/data/query/${SANITY_CONFIG.dataset}?query=${q}`);
        const data = await res.json();
        if (data && data.result) {
          if (data.result.projects && data.result.projects.length) {
            const map = {};
            data.result.projects.forEach((p, idx) => {
              const rawTitle = (p.title && (p.title.es || p.title)) || '';
              const cleanSlug = p.slug || slugify(rawTitle) || p.id || p._id || `proj-${idx}`;
              p.slugKey = cleanSlug;
              map[cleanSlug] = p;
            });
            projects = map;
          }
          if (data.result.taller && (data.result.taller.manifesto_1 || data.result.taller.distinctions)) {
            tallerData = data.result.taller;
          }
          if (data.result.contact && (data.result.contact.intro || data.result.contact.emails)) {
            contactData = data.result.contact;
          }

          if (currentView === 'home') renderHomeScatter();
          renderFilters();
          renderWorkList();
          renderInfoView();
          renderContact();
          if (currentView === 'project' && currentProjectId && projects[currentProjectId]) {
            openProject(currentProjectId);
          }
        }
      } catch (e) {
        console.log('Sanity fallback activo.');
      }
    }

    // Inicialización
    (function init() {
      try { renderHomeScatter(); } catch(e) { console.error(e); }
      try { renderFilters(); } catch(e) { console.error(e); }
      try { renderWorkList(); } catch(e) { console.error(e); }
      try { renderInfoView(); } catch(e) { console.error(e); }
      try { renderContact(); } catch(e) { console.error(e); }

      const hash = window.location.hash.replace('#', '');
      if (hash && hash !== 'home' && hash !== 'work' && hash !== 'info' && hash !== 'taller' && hash !== 'contact' && hash !== 'contacto' && findProjectKey(hash)) {
        openProject(hash);
      } else if (hash === 'work') {
        navigateTo('work');
      } else if (hash === 'info' || hash === 'taller') {
        navigateTo('info');
      } else if (hash === 'contact' || hash === 'contacto') {
        navigateTo('contact');
      } else {
        navigateTo('home');
      }
      setTimeout(handleScrollUpdates, 50);

      fetchSanity();
    })();
  </script>
